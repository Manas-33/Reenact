[project]
name = "reenact"
version = "0.0.1"
description = "Regression testing for LLM agents - record agent runs, replay them deterministically, and gate regressions in CI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Manas Dalvi" }]
keywords = [
    "llm",
    "agents",
    "regression-testing",
    "replay",
    "evals",
    "langgraph",
    "testing",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://reenact.dev"

[project.scripts]
reenact = "reenact.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reenact"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "langchain-core>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options via calls in parameter defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
