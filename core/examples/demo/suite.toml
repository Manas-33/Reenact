# The issue-triage demo eval suite, over the committed baseline recordings.
# Assertions only, so it runs offline with no key:
#   reenact eval suite.toml
#   reenact ci suite.toml --baseline baseline.json
# The judge-scored version (catch rate + FPR) lives in the regression bench.

[[scenario]]
name = "triage-42"
cassette = "scenarios/baseline/issue-42.json"

  [[scenario.check]]
  type = "called_tool"
  name = "search_docs"

  [[scenario.check]]
  type = "called_tool"
  name = "label_issue"

  [[scenario.check]]
  type = "called_tool"
  name = "post_reply"

  [[scenario.check]]
  type = "no_mutating_tool_reexecuted"

  [[scenario.check]]
  type = "answer_contains"
  value = "password"

