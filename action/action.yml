# Composite Action wrapping the reenact CLI - runs the regression gate on a PR.
# It sets up Python, installs reenact, runs `reenact ci` (which replays the
# committed scenario suite offline and fails only on a regression vs the baseline),
# and posts a sticky PR comment + a merge-gating check-run. The `ci` step failing is
# what turns the job red; the post step runs anyway (`if: always()`) so the PR still
# gets its comment.
name: Reenact
description: Regression testing for LLM agents - gate a PR on agent behavior.
branding:
  icon: git-pull-request
  color: purple

inputs:
  suite:
    description: Path to the TOML eval suite (relative to working-directory).
    required: true
  baseline:
    description: Path to the committed baseline JSON to diff against.
    required: true
  tolerance:
    description: Judge-score drop tolerated before it counts as a regression.
    required: false
    default: "0.05"
  working-directory:
    description: Directory to run reenact in.
    required: false
    default: "."
  python-version:
    description: Python version to set up for the run.
    required: false
    default: "3.12"
  version:
    description: >-
      pip install spec for reenact (e.g. "reenact", "reenact==0.1.0", a
      "git+https://..." URL, or a local path like "./core").
    required: false
    default: reenact
  token:
    description: >-
      GitHub token for posting the PR comment + check-run (pass github.token).
      Leave empty to skip posting - the job still passes/fails on the gate.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install reenact
      shell: bash
      run: python -m pip install "${{ inputs.version }}"

    - name: Run reenact ci
      id: ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: >-
        reenact ci "${{ inputs.suite }}"
        --baseline "${{ inputs.baseline }}"
        --tolerance "${{ inputs.tolerance }}"
        --json "${{ runner.temp }}/reenact-diff.json"

    - name: Post result to the pull request
      if: ${{ always() && inputs.token != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: >-
        reenact report "${{ runner.temp }}/reenact-diff.json"
        --repo "${{ github.repository }}"
        --sha "${{ github.event.pull_request.head.sha || github.sha }}"
        --pr "${{ github.event.pull_request.number }}"
